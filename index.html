<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #181b1f;
      color: #d8d9da;
      font-family: sans-serif;
      padding: 16px;
      font-size: 14px;
    }
    h3 { color: #ff6600; margin-bottom: 12px; font-size: 15px; }
    label { display: block; margin-bottom: 4px; color: #aaa; font-size: 12px; }
    input[type="number"],
    input[type="text"],
    input[type="time"] {
      width: 100%;
      padding: 8px;
      background: #2c2f35;
      border: 1px solid #444;
      color: white;
      border-radius: 4px;
      margin-bottom: 10px;
      color-scheme: dark;
    }
    .section {
      background: #222426;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button {
      padding: 9px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-blue   { background: #1e6fbf; color: white; width: 100%; margin-top: 8px; }
    .btn-green  { background: #1a9e4a; color: white; }
    .btn-red    { background: #c0392b; color: white; }
    .btn-gray   { background: #444; color: white; }

    /* วันในสัปดาห์ */
    .day-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .day-btn {
      flex: 1;
      min-width: 36px;
      padding: 8px 4px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2c2f35;
      color: #aaa;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      user-select: none;
    }
    .day-btn.selected {
      background: #ff6600;
      color: white;
      border-color: #ff6600;
    }

    .schedule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2c2f35;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .schedule-item .time-label {
      font-size: 20px;
      font-weight: bold;
      color: #ff6600;
      min-width: 60px;
    }
    .schedule-item .detail {
      flex: 1;
      padding: 0 10px;
      font-size: 12px;
      color: #aaa;
    }
    .schedule-item .detail .name { color: white; font-size: 13px; margin-bottom: 2px; }
    .schedule-item .detail .days { color: #f5a623; }
    .schedule-item .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #444;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .schedule-item .status-dot.active { background: #1a9e4a; }
    .schedule-item .status-dot.done   { background: #f5a623; }

    #global-status {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      background: #2c2f35;
    }
    #global-status.running { border: 1px solid #1a9e4a; color: #1a9e4a; }
    #global-status.stopped { border: 1px solid #444;    color: #aaa; }
    #clock { text-align: center; font-size: 32px; font-weight: bold; color: white; letter-spacing: 2px; }
    #date-display { text-align: center; color: #aaa; font-size: 12px; margin: 4px 0 12px; }
    #log {
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px;
      font-size: 12px;
      max-height: 130px;
      overflow-y: auto;
      color: #73bf69;
      font-family: monospace;
    }
    .log-entry { margin-bottom: 4px; }
    .log-entry.error { color: #e74c3c; }
    .empty-msg { color: #555; font-size: 13px; text-align: center; padding: 10px; }
    .ctrl-row { display: flex; gap: 8px; margin-top: 10px; }
    .ctrl-row button { flex: 1; padding: 10px; }
  </style>
</head>
<body>

  <!-- นาฬิกา -->
  <div class="section">
    <div id="clock">00:00:00</div>
    <div id="date-display">--</div>
    <div id="global-status" class="stopped">⏹ ยังไม่ได้เริ่ม Scheduler</div>
  </div>

  <!-- เพิ่มตารางรดน้ำ -->
  <div class="section">
    <h3>🌱 เพิ่มตารางรดน้ำ</h3>

    <label>ชื่อรอบ (เช่น รดเช้า)</label>
    <input type="text" id="new-label" placeholder="รดน้ำเช้า">

    <label>เวลา</label>
    <input type="time" id="new-time" value="06:00">

    <label>วันที่ต้องการรด</label>
    <div class="day-selector">
      <div class="day-btn" data-day="0" onclick="toggleDay(this)">อา</div>
      <div class="day-btn selected" data-day="1" onclick="toggleDay(this)">จ</div>
      <div class="day-btn selected" data-day="2" onclick="toggleDay(this)">อ</div>
      <div class="day-btn selected" data-day="3" onclick="toggleDay(this)">พ</div>
      <div class="day-btn selected" data-day="4" onclick="toggleDay(this)">พฤ</div>
      <div class="day-btn selected" data-day="5" onclick="toggleDay(this)">ศ</div>
      <div class="day-btn" data-day="6" onclick="toggleDay(this)">ส</div>
    </div>

    <label>Field 1 (5 = เปิด / 0 = ปิด)</label>
    <input type="number" id="new-field1" value="1">

    <button class="btn-blue" onclick="addSchedule()">➕ เพิ่มรอบนี้</button>
  </div>

  <!-- รายการ -->
  <div class="section">
    <h3>📋 ตารางรดน้ำ</h3>
    <div id="schedule-list">
      <div class="empty-msg">ยังไม่มีตาราง — กด ➕ เพิ่มด้านบน</div>
    </div>
    <div class="ctrl-row">
      <button class="btn-green" onclick="startScheduler()">▶ เริ่ม</button>
      <button class="btn-red"   onclick="stopScheduler()">⏹ หยุด</button>
    </div>
  </div>

  <!-- Log -->
  <div class="section">
    <h3>📝 Log การส่ง</h3>
    <div id="log"><span style="color:#555">รอการส่งข้อมูล...</span></div>
  </div>

<script>
  const API_KEY = "4DJYWFHXB18MR0BE"; // ← Fixed API Key

  const DAY_NAMES = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
  const DAY_SHORT = ["อา","จ","อ","พ","พฤ","ศ","ส"];

  let schedules = [];
  let schedulerRunning = false;
  let tickInterval = null;
  let lastCheckedMinute = "";

  // นาฬิกา
  setInterval(() => {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById("clock").innerText = `${h}:${m}:${s}`;
    document.getElementById("date-display").innerText =
      now.toLocaleDateString('th-TH', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }, 1000);

  function toggleDay(el) {
    el.classList.toggle("selected");
  }

  function getSelectedDays() {
    return [...document.querySelectorAll(".day-btn.selected")].map(el => parseInt(el.dataset.day));
  }

  function addSchedule() {
    const time   = document.getElementById("new-time").value;
    const label  = document.getElementById("new-label").value.trim() || `รอบ ${time}`;
    const field1 = document.getElementById("new-field1").value;
    const days   = getSelectedDays();

    if (!time)         { alert("กรุณาเลือกเวลา"); return; }
    if (days.length === 0) { alert("กรุณาเลือกอย่างน้อย 1 วัน"); return; }

    schedules.push({
      id: Date.now(),
      time, label, field1,
      days,
      sentToday: false,
      lastSent: null
    });
    schedules.sort((a,b) => a.time.localeCompare(b.time));
    renderList();
  }

  function removeSchedule(id) {
    schedules = schedules.filter(s => s.id !== id);
    renderList();
  }

  function daysLabel(days) {
    if (days.length === 7) return "ทุกวัน";
    if (JSON.stringify(days) === JSON.stringify([1,2,3,4,5])) return "จันทร์–ศุกร์";
    if (JSON.stringify(days) === JSON.stringify([0,6])) return "เสาร์–อาทิตย์";
    return days.map(d => DAY_SHORT[d]).join(", ");
  }

  function renderList() {
    const el = document.getElementById("schedule-list");
    if (schedules.length === 0) {
      el.innerHTML = '<div class="empty-msg">ยังไม่มีตาราง — กด ➕ เพิ่มด้านบน</div>';
      return;
    }
    el.innerHTML = schedules.map(s => `
      <div class="schedule-item">
        <div class="status-dot ${s.sentToday ? 'done' : (schedulerRunning ? 'active' : '')}" id="dot-${s.id}"></div>
        <div class="time-label">${s.time}</div>
        <div class="detail">
          <div class="name">${s.label}</div>
          <div class="days">📅 ${daysLabel(s.days)}</div>
          <div>${s.lastSent ? '✅ ส่งล่าสุด: ' + s.lastSent : '⏳ รอส่ง'}</div>
        </div>
        <button class="btn-gray" onclick="removeSchedule(${s.id})" style="font-size:12px;padding:6px 10px">ลบ</button>
      </div>
    `).join('');
  }

  function startScheduler() {
    if (schedules.length === 0) { alert("กรุณาเพิ่มตารางก่อน"); return; }

    schedulerRunning = true;
    document.getElementById("global-status").className = "running";
    document.getElementById("global-status").innerText = "🟢 Scheduler กำลังทำงาน...";

    tickInterval = setInterval(() => {
      const now = new Date();
      const currentDay = now.getDay();
      const currentMinute = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      // reset เที่ยงคืน
      if (currentMinute === "00:00" && lastCheckedMinute !== "00:00") {
        schedules.forEach(s => s.sentToday = false);
        addLog("🔄 รีเซ็ตประจำวัน (เที่ยงคืน)");
        renderList();
      }

      if (currentMinute !== lastCheckedMinute) {
        lastCheckedMinute = currentMinute;
        schedules.forEach(s => {
          if (s.time === currentMinute && !s.sentToday && s.days.includes(currentDay)) {
            s.sentToday = true;
            s.lastSent = now.toLocaleTimeString('th-TH');
            sendToThingSpeak(s.label, s.field1);
            renderList();
          }
        });
      }
    }, 1000);

    renderList();
    addLog("▶ เริ่ม Scheduler แล้ว");
  }

  function stopScheduler() {
    schedulerRunning = false;
    clearInterval(tickInterval);
    document.getElementById("global-status").className = "stopped";
    document.getElementById("global-status").innerText = "⏹ หยุด Scheduler แล้ว";
    renderList();
    addLog("⏹ หยุด Scheduler แล้ว");
  }

  function sendToThingSpeak(label, field1) {
    let url = `https://api.thingspeak.com/update?api_key=${API_KEY}&field1=${field1}`;
    fetch(url)
      .then(r => r.text())
      .then(res => {
        const time = new Date().toLocaleTimeString('th-TH');
        if (res === "0") {
          addLog(`❌ [${time}] ${label} — ส่งไม่สำเร็จ`, true);
        } else {
          addLog(`✅ [${time}] ${label} — ส่งสำเร็จ! Entry: ${res}`);
        }
      })
      .catch(e => addLog(`❌ Error: ${e}`, true));
  }

  function addLog(msg, isError = false) {
    const log = document.getElementById("log");
    const div = document.createElement("div");
    div.className = "log-entry" + (isError ? " error" : "");
    div.innerText = msg;
    log.prepend(div);
    while (log.children.length > 50) log.removeChild(log.lastChild);
  }
</script>
</body>
</html>
